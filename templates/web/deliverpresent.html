{% extends 'base.html' %}
{% block title %}Deliver presents{% endblock %}

{% block content %}
<form class="form-block" action="/web/deliverpresent" method="post">
    <h2 class="form-title">Deliver to the user</h2>

    <label for="name">Arcaea Username</label>
    <input name="name" id="name">

    <div class="field-or">or</div>

    <label for="user_code">Arcaea User Code</label>
    <input name="user_code" id="user_code">

    <label for="present_id">ID of the present</label>
    <input name="present_id" id="present_id" required>

    <input type="submit" value="Edit">
</form>

<form class="form-block" action="/web/deliverpresent" method="post">
    <h2 class="form-title">Deliver to all the users</h2>

    <label for="present_id_all">ID of the present</label>
    <input name="present_id" id="present_id_all" required>

    <input type="submit" value="Edit all">
</form>

{% endblock %}
